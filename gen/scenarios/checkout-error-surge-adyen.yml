id: checkout-error-surge-adyen
narrative: >-
  Adyen started rejecting a quarter of charges at the ten minute mark, and the
  failures surface at checkout. us-east-1 has had a low background failure rate
  on payments since before the window opened, which is not this.
baseline: {rps: 15, minutes: 20}
fault:
  onset_min: 10
  where: {payment.provider: "adyen"}
  effect: {span: "payments.charge", latency_add_ms: 0, error_rate: 0.25}
ground_truth:
  incident_present: true
  root_cause_dims: {payment.provider: "adyen"}
  slow_or_failing_span: payments.charge
  affected_share: 0.25
red_herrings:
  - where: {cloud.region: "us-east-1"}
    effect: {span: "payments.charge", error_rate: 0.03}
    onset_min: 0
    note: pre-existing low failure rate in us-east-1, larger than baseline but steady
