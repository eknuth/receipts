id: herring-customer-whale
narrative: >-
  adyen started failing a fifth of its charges at the ten minute mark. One customer,
  cust-00007, is a whale who alone makes 15% of all traffic and about 30% of all errors
  over the whole window: their own error rate ran about 11x the rest of the traffic
  before onset (0.049 against 0.0045), and climbed further after, since they use adyen
  a quarter of the time. Excluding the whale, adyen's error rate still steps about 13x
  at onset; excluding adyen, the whale's own error rate stays flat across onset.
  Breaking down on customer.id surfaces the whale; breaking down on payment.provider
  surfaces adyen and the step.
baseline: {rps: 15, minutes: 20}
dimensions:
  customer.id: {"cust-00007": 0.15}
fault:
  onset_min: 10
  where: {payment.provider: "adyen"}
  effect: {span: "payments.charge", error_rate: 0.2}
ground_truth:
  incident_present: true
  root_cause_dims: {payment.provider: "adyen"}
  slow_or_failing_span: payments.charge
  affected_share: 0.25
red_herrings:
  - where: {customer.id: "cust-00007"}
    effect: {span: "payments.charge", error_rate: 0.043}
    onset_min: 0
    note: cust-00007 is 15% of all traffic and about 30% of all errors over the window, present before onset, with its own error rate running about 11x the rest of the traffic; excluding adyen, that rate stays flat across onset, which marks it as a red herring
